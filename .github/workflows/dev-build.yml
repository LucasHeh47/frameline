# Every push to the develop branch publishes a development build: a GitHub pre-release such as
# v1.0.3-beta.12 (the tag is created together with the release). People who turn on
# Settings → Updates → Developer branch are offered these.
name: Development build

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip commits that are already a regular release
        id: check
        shell: bash
        run: |
          if git describe --exact-match --tags --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "v*-*" HEAD >/dev/null 2>&1; then
            echo "This commit is a regular release; no development build needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      - name: Set the development version
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION=$(node scripts/dev-version.mjs ${{ github.run_number }})
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/release-notes.mjs
      - name: Build and publish the pre-release
        if: steps.check.outputs.skip != 'true'
        run: npm run release -- --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
